{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="form-contenedor">
  <a class="volver" href="{{ lista_url }}">← Volver a la lista</a>
  <p class="antetitulo">Confirmación</p>
  <div class="panel">
    <h1>{{ titulo }}</h1>
    <p>¿Querés eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">{% csrf_token %}
      <div class="acciones"><button class="peligro" type="submit">Sí, eliminar</button><a href="{{ lista_url }}">Cancelar</a></div>
    </form>
  </div>
</div>
{% endblock %}
