{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="form-contenedor">
  <a class="volver" href="{{ lista_url }}">← Volver a la lista</a>
  <p class="antetitulo">Gestión del salón</p>
  <h1>{{ titulo }}</h1>
  <p>Completá los datos y guardá los cambios.</p>
  <form method="post" class="panel">{% csrf_token %}
    {% include 'componentes/formulario.html' %}
    <div class="acciones"><button type="submit">Guardar</button><a href="{{ lista_url }}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
