{% extends 'base.html' %}

{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="form-contenedor">
  <a class="volver" href="{% url 'inicio:home' %}">← Volver al inicio</a>
  <p class="antetitulo">Tu cuenta</p>
  <h1>Cambiar contraseña</h1>
  <p>Ingresá tu contraseña actual y elegí una nueva.</p>
  <form method="post" class="panel">{% csrf_token %}
    {% include 'componentes/formulario.html' %}
    <div class="acciones"><button type="submit">Cambiar contraseña</button><a href="{% url 'inicio:home' %}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
